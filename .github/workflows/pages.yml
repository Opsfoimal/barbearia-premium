name: Publicar site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: barbearia-premium

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar site
        run: npm run build -- --base=/barbearia-premium/
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: barbearia-premium/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4